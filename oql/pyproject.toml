[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quotient-learning"
version = "0.1.0"
description = "Model-free learning of Myhill-Nerode quotients of bounded-agent POMDPs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "npow" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "joblib>=1.3",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
sim = [
    "pomdp-py>=1.3",
    "gymnasium>=0.29",
]
continuous = [
    "gymnasium[mujoco]>=0.29",
    "mujoco>=3.0",
    "dm-control>=1.0.18",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.4",
]

[tool.setuptools.packages.find]
include = ["quotient_learning*", "environments*", "experiments*"]
exclude = ["tests*", "paper*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
