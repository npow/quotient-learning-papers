[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-quotient"
version = "0.1.0"
description = "Model-free Myhill-Nerode quotient learning for continuous state/action POMDPs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "npow" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.0",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
mujoco = [
    "gymnasium[mujoco]>=0.29",
    "mujoco>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["continuous_quotient*"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (requires MuJoCo or long runtimes)",
]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
